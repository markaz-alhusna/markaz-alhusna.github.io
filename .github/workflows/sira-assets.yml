name: Сира — материалы для видео
on:
  push:
    branches: [sira-video]
    paths: ['sira/request.json']
permissions:
  contents: write
concurrency: { group: sira-assets, cancel-in-progress: false }
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Голоса и остаток символов (бесплатные запросы)
        env: { KEY: '${{ secrets.ELEVENLABS_API_KEY }}' }
        run: |
          mkdir -p sira/assets
          curl -s -H "xi-api-key: $KEY" https://api.elevenlabs.io/v1/voices > sira/assets/voices-raw.json || true
          jq '[.voices[]? | {name, voice_id, category, labels}]' sira/assets/voices-raw.json > sira/assets/voices.json || true
          curl -s -H "xi-api-key: $KEY" https://api.elevenlabs.io/v1/user/subscription > sira/assets/subscription-raw.json || true
          jq '{tier, character_count, character_limit, next_character_count_reset_unix}' sira/assets/subscription-raw.json > sira/assets/subscription.json || true
          head -c 600 sira/assets/voices-raw.json; echo; cat sira/assets/subscription.json || true
      - name: Аяты — чтение аль-Катами
        run: |
          mkdir -p sira/assets/quran
          for a in $(jq -r '.ayat[]' sira/request.json); do
            for r in Nasser_Alqatami_128kbps; do
              curl -sfL -o sira/assets/quran/$a.mp3 https://everyayah.com/data/$r/$a.mp3 && echo "ok $a" && break || echo "нет $a у $r"
            done
          done
          ls -la sira/assets/quran
      - name: Сохраняем
        run: |
          git config user.name "al-husna-bot"; git config user.email "actions@users.noreply.github.com"
          git add sira/assets; git diff --cached --quiet || (git commit -m "Сира: материалы" && git push origin HEAD:sira-video)
