# Не даёт бесплатной базе Supabase «уснуть» от простоя: раз в 2 дня делает один лёгкий запрос.
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            "https://navxqjofqvstxfrsaeju.supabase.co/rest/v1/school?select=key&limit=1" \
            -H "apikey: sb_publishable_y4FvUXr3nhMR8dI0CKTrDg_J-SonwKG"
