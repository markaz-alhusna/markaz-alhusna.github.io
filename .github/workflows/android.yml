name: Приложение Android
# Собирает приложение для Google Play: оно открывает сайт школы, поэтому правки сайта попадают в приложение сами.
# Пока нет секретов ANDROID_KEYSTORE_B64 и ANDROID_KEYSTORE_PASSWORD — собирается пробная версия с временным ключом (только чтобы установить на телефон и посмотреть).
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Номер сборки (каждый раз на 1 больше, первый — 1)'
        required: false
        default: '1'
      version_name:
        description: 'Версия для людей'
        required: false
        default: '1.0.0'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Ставим Bubblewrap
        run: |
          npm i -g @bubblewrap/cli@1
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | sdkmanager --licenses > /dev/null || true
      - name: Ключ подписи
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd app/android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > upload.keystore
            echo "KS_PASS=$KS_PASS" >> $GITHUB_ENV; echo "MODE=release" >> $GITHUB_ENV
          else
            echo "::warning::Секрета с ключом нет — собираю ПРОБНУЮ версию с временным ключом. В Google Play её не загружать."
            keytool -genkeypair -keystore upload.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass testtest -keypass testtest -dname "CN=AL-HUSNA test"
            echo "KS_PASS=testtest" >> $GITHUB_ENV; echo "MODE=test" >> $GITHUB_ENV
          fi
          echo "Отпечаток ключа (нужен для assetlinks.json):"
          keytool -list -v -keystore upload.keystore -alias upload -storepass "$(grep KS_PASS $GITHUB_ENV | cut -d= -f2-)" | grep SHA256
      - name: Собираем
        env:
          VC: ${{ github.event.inputs.version_code }}
          VN: ${{ github.event.inputs.version_name }}
        run: |
          cd app/android
          node -e "const f='twa-manifest.json',m=require('./'+f);m.appVersionCode=+process.env.VC||1;m.appVersionName=process.env.VN||'1.0.0';require('fs').writeFileSync(f,JSON.stringify(m,null,2))"
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          BUBBLEWRAP_KEYSTORE_PASSWORD="$KS_PASS" BUBBLEWRAP_KEY_PASSWORD="$KS_PASS" bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
          mkdir -p out && cp app-release-bundle.aab app-release-signed.apk out/ 2>/dev/null; ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: al-husna-android-${{ env.MODE }}
          path: app/android/out/
          retention-days: 14
