name: Озвучка
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Переозвучить только эту строку (необязательно)'
        required: false
  push:
    paths: ['voice/list.json', 'voice/config.json']
permissions:
  contents: write
concurrency: { group: voice, cancel-in-progress: false }
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Делаем mp3
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ONLY: ${{ github.event.inputs.only }}
        run: node voice/gen.mjs
      - name: Сохраняем
        run: |
          git config user.name "al-husna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add voice
          git diff --cached --quiet || (git commit -m "Озвучка: новые файлы" && git push)
