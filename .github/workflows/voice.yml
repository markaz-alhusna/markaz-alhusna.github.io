name: Озвучка
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько новых файлов сделать (пусто — все)'
        required: false
      stages:
        description: 'Какие этапы (через запятую): common, artest, q1 …'
        required: false
      only:
        description: 'Переозвучить только эту строку (необязательно)'
        required: false
permissions:
  contents: write
concurrency: { group: voice, cancel-in-progress: false }
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Ставим ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Делаем mp3
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit }}
          ONLY: ${{ github.event.inputs.only }}
          STAGES: ${{ github.event.inputs.stages }}
        run: |
          set -o pipefail
          node voice/gen.mjs 2>&1 | tee voice/last-run.log
      - name: Сохраняем
        if: always()
        run: |
          git config user.name "al-husna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add voice
          git diff --cached --quiet || (git commit -m "Озвучка: новые файлы" && git pull --rebase && git push)
