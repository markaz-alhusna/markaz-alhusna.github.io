<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка озвучки</title><meta name="robots" content="noindex">
<style>
:root{--navy:#14315C;--bg:#FFF9F0;--line:#E8DDCB}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--navy)}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:0 0 6px}p{margin:0 0 16px;color:#4A6283}
.f{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.f button{border:0;border-radius:99px;padding:8px 14px;background:#fff;box-shadow:0 0 0 1px var(--line);font:inherit;cursor:pointer}.f button.on{background:var(--navy);color:#fff}
.it{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 0 0 1px var(--line)}
.k{font-size:16px;line-height:1.4}.k[lang=ar]{font-family:Amiri,'Noto Naskh Arabic',serif;font-size:30px;direction:rtl;text-align:right}
.t{font-size:13px;color:#7A8BA3;margin:4px 0 8px}.t[lang=ar]{font-size:20px;direction:rtl;text-align:right}
audio{width:100%;height:36px}.n{font-size:12px;color:#9AA7B8}
</style></head><body><main>
<h1>Проверка озвучки</h1><p>Послушайте каждый звук. Если что-то звучит неправильно, напишите номер — переозвучим.</p>
<div class="f"><button data-f="all" class="on">Всё</button><button data-f="ar">Арабский</button><button data-f="ru">Русский</button></div>
<div id="l">Загружаем…</div></main>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
Promise.all([fetch('index.json',{cache:'no-cache'}).then(r=>r.json()),fetch('list.json',{cache:'no-cache'}).then(r=>r.json())]).then(([idx,list])=>{
  const fileOf=k=>idx[k]?idx[k].replace(/^voice\//,''):null;
  const STG=new URLSearchParams(location.search).get('stage');
  const items=list.items.filter(i=>(i.parts||idx[i.key]) && (!STG || STG.split(/[ ,]/).includes(i.stage))).map((i,n)=>Object.assign({},i,{n:n+1}));
  const card=i=>{
    const isAr=/[؀-ۿ]/.test(i.key);
    let h='<div class="it"><div class="n">№ '+i.n+' · '+(i.parts?'по частям':(i.lang==='ar'?'арабский':'русский'))+'</div>';
    h+='<div class="k" lang="'+(isAr?'ar':'ru')+'">'+esc(i.key)+'</div>';
    if(i.parts){
      i.parts.forEach(p=>{ const ar=p.startsWith('ar:'); const k=ar?p.slice(3):p; const f=fileOf(k);
        h+='<div class="t" lang="'+(ar?'ar':'ru')+'">'+(ar?'арабский голос: ':'')+esc(k)+'</div>';
        h+= f ? '<audio controls preload="none" src="'+f+'"></audio>' : '<div class="t">— пока нет звука</div>'; });
    } else {
      if(i.text!==i.key) h+='<div class="t" lang="'+i.lang+'">голос читает: '+esc(i.text)+'</div>';
      h+='<audio controls preload="none" src="'+fileOf(i.key)+'"></audio>';
    }
    return h+'</div>';
  };
  const draw=f=>{ const L=items.filter(i=>f==='all'||(i.parts?'ru':i.lang)===f); document.getElementById('l').innerHTML=L.map(card).join('')||'Пока нет файлов.'; };
  draw('all');
  document.querySelectorAll('.f button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.f button').forEach(x=>x.classList.toggle('on',x===b)); draw(b.dataset.f); });
}).catch(e=>{ document.getElementById('l').textContent='Не получилось загрузить список: '+e.message; });
</script></body></html>
